# Compila a solução e roda os testes a cada push e pull request (sem gerar instalador nem assinar).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build HardwareMonitor.sln -c Release -nologo
      - name: Testes
        run: dotnet test tests/HwMon.Tests/HwMon.Tests.csproj -c Release -nologo --no-build
